<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle 14 triage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf7; --surface: #ffffff; --ink: #1a1a1f; --ink-soft: #555560;
    --rule: #e7e5df; --accent: #1d4ed8; --warn: #b45309; --danger: #b91c1c; --ok: #15803d;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e12; --surface: #16161c; --ink: #f1f1f4; --ink-soft: #a8a8b3;
            --rule: #2a2a32; --accent: #93c5fd; --warn: #fbbf24; --danger: #f87171; --ok: #4ade80; }
  }
  html { background: var(--bg); color: var(--ink); }
  body { font: 14px/1.4 var(--sans); margin: 0; padding: 1rem; padding-bottom: 5rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .2rem; }
  header p { margin: 0 0 1rem; color: var(--ink-soft); max-width: 75ch; }
  kbd { font: .8em var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 0 .3em; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(12rem, 1fr)); gap: .75rem; overflow-x: auto; }
  .col { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); min-height: 10rem; display: flex; flex-direction: column; }
  .col h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin: 0; padding: .5rem .6rem; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; }
  .col[data-bucket=now] h2 { color: var(--danger); }
  .col[data-bucket=next] h2 { color: var(--warn); }
  .col[data-bucket=later] h2 { color: var(--accent); }
  .col[data-bucket=cut] h2 { color: var(--ink-soft); }
  .col ul { list-style: none; margin: 0; padding: .4rem; flex: 1; }
  .col.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .ticket { border: 1px solid var(--rule); border-radius: 3px; padding: .35rem .5rem; margin-bottom: .35rem; background: var(--bg); cursor: grab; }
  .ticket:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ticket .id { font: 600 .75rem var(--mono); color: var(--ink-soft); }
  .ticket .why { display: block; font-size: .8rem; color: var(--ink-soft); }
  .ticket .moves { display: flex; gap: .25rem; margin-top: .25rem; }
  .ticket .moves button { font: .7rem var(--sans); padding: .05rem .35rem; }
  .warn-cap { color: var(--danger); font-size: .8rem; padding: 0 .6rem .4rem; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
           padding: .6rem 1rem; background: var(--surface); border-top: 1px solid var(--rule); }
  footer .counts { margin-right: auto; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: .35rem .8rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #fallback { width: 100%; height: 8rem; font: .8rem var(--mono); }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Cycle 14 triage</h1>
  <p>Twelve tickets, pre-sorted into a best guess. Drag them between columns, or focus one and press <kbd>1</kbd>–<kbd>4</kbd> (<kbd>j</kbd>/<kbd>k</kbd> to move focus). When the cut feels right, copy the result back into the chat. Example artifact · layout from <code>references/custom-editors.md</code> · fictional tickets.</p>
</header>

<main class="board" id="board"></main>

<footer>
  <span class="counts" id="counts" aria-live="polite"></span>
  <span id="status" role="status"></span>
  <button id="reset" type="button">Reset</button>
  <button id="copy-json" type="button">Copy as JSON</button>
  <button id="copy-md" type="button" class="primary">Copy as markdown</button>
  <textarea id="fallback" hidden aria-label="Export text to copy by hand" readonly></textarea>
</footer>

<script>
  const BUCKETS = [['now', 'Now'], ['next', 'Next'], ['later', 'Later'], ['cut', 'Cut']];
  const NOW_CAPACITY = 4;
  const TICKETS = [
    { id: 'TICK-101', title: 'Checkout times out on slow 3G', bucket: 'now', why: 'Top support driver' },
    { id: 'TICK-104', title: 'Retry webhook deliveries', bucket: 'now', why: 'Partners losing events' },
    { id: 'TICK-109', title: 'Rotate gateway certificate automatically', bucket: 'now', why: 'Last outage' },
    { id: 'TICK-112', title: 'Dark mode for invoices', bucket: 'later', why: 'Nice to have' },
    { id: 'TICK-115', title: 'Export orders as CSV', bucket: 'next', why: 'Asked by 3 accounts' },
    { id: 'TICK-117', title: 'Bulk refund tool', bucket: 'next', why: 'Saves support 4 h/week' },
    { id: 'TICK-118', title: 'Rewrite admin in new framework', bucket: 'cut', why: 'No user problem' },
    { id: 'TICK-121', title: 'Search typo tolerance', bucket: 'later', why: 'Query logs show little need' },
    { id: 'TICK-123', title: 'Audit log for role changes', bucket: 'next', why: 'Compliance ask' },
    { id: 'TICK-126', title: 'Animated onboarding tour', bucket: 'cut', why: 'Unclear value' },
    { id: 'TICK-128', title: 'Fix VAT rounding on credit notes', bucket: 'now', why: 'Wrong totals' },
    { id: 'TICK-130', title: 'Saved filters on orders page', bucket: 'later', why: 'Power users only' },
  ];
  const SAVED_STATE_NAME = 'cycle-14-triage';

  // Storage may be blocked (sandboxed previews); fall back to memory.
  const memory = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return memory[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { memory[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch { delete memory[k]; } },
  };

  let placement = new Map(TICKETS.map(t => [t.id, t.bucket]));
  const saved = store.get(SAVED_STATE_NAME);
  if (saved) {
    try { placement = new Map(Object.entries(JSON.parse(saved))); } catch { store.del(SAVED_STATE_NAME); }
  }

  const board = document.getElementById('board');
  let focusId = null;

  function render() {
    board.innerHTML = '';
    for (const [key, label] of BUCKETS) {
      const col = document.createElement('section');
      col.className = 'col';
      col.dataset.bucket = key;
      col.setAttribute('aria-label', label);
      const items = TICKETS.filter(t => placement.get(t.id) === key);
      col.innerHTML = `<h2>${label}<span>${items.length}</span></h2>` +
        (key === 'now' && items.length > NOW_CAPACITY ? `<p class="warn-cap">Over capacity: Now holds ${NOW_CAPACITY}.</p>` : '') + '<ul></ul>';
      const ul = col.querySelector('ul');
      for (const t of items) {
        const li = document.createElement('li');
        li.className = 'ticket';
        li.draggable = true;
        li.tabIndex = 0;
        li.dataset.id = t.id;
        li.innerHTML = `<span class="id">${t.id}</span> ${t.title}<span class="why">${t.why}</span><span class="moves"></span>`;
        for (const [k, l] of BUCKETS) {
          if (k === key) continue;
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = '→ ' + l;
          b.setAttribute('aria-label', `Move ${t.id} to ${l}`);
          b.addEventListener('click', () => move(t.id, k));
          li.querySelector('.moves').append(b);
        }
        li.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', t.id));
        li.addEventListener('focus', () => { focusId = t.id; });
        ul.append(li);
      }
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => { e.preventDefault(); move(e.dataTransfer.getData('text/plain'), key); });
      board.append(col);
    }
    document.getElementById('counts').textContent = BUCKETS.map(([k, l]) =>
      `${l} ${TICKETS.filter(t => placement.get(t.id) === k).length}`).join(' · ');
    if (focusId) board.querySelector(`[data-id="${focusId}"]`)?.focus();
  }

  function move(id, bucket) {
    if (!placement.has(id)) return;
    placement.set(id, bucket);
    focusId = id;
    store.set(SAVED_STATE_NAME, JSON.stringify(Object.fromEntries(placement)));
    render();
  }

  function asMarkdown() {
    return BUCKETS.map(([k, l]) => `## ${l}\n` + TICKETS.filter(t => placement.get(t.id) === k)
      .map(t => `- ${t.id}: ${t.title} (${t.why})`).join('\n')).join('\n\n');
  }

  function asJson() {
    return JSON.stringify(Object.fromEntries(BUCKETS.map(([k]) =>
      [k, TICKETS.filter(t => placement.get(t.id) === k).map(t => t.id)])), null, 2);
  }

  async function copy(text) {
    const status = document.getElementById('status');
    const fallback = document.getElementById('fallback');
    try {
      await navigator.clipboard.writeText(text);
      fallback.hidden = true;
      status.textContent = 'Copied.';
    } catch {
      fallback.value = text;
      fallback.hidden = false;
      fallback.select();
      status.textContent = 'Clipboard blocked: press Ctrl+C.';
    }
  }

  document.addEventListener('keydown', e => {
    const li = e.target.closest?.('.ticket');
    if (!li || e.target.tagName === 'BUTTON') return;
    const n = Number(e.key);
    if (n >= 1 && n <= BUCKETS.length) move(li.dataset.id, BUCKETS[n - 1][0]);
    if (e.key === 'j' || e.key === 'k') {
      const all = [...board.querySelectorAll('.ticket')];
      all[Math.max(0, Math.min(all.length - 1, all.indexOf(li) + (e.key === 'j' ? 1 : -1)))].focus();
    }
  });
  document.getElementById('copy-md').addEventListener('click', () => copy(asMarkdown()));
  document.getElementById('copy-json').addEventListener('click', () => copy(asJson()));
  document.getElementById('reset').addEventListener('click', () => {
    placement = new Map(TICKETS.map(t => [t.id, t.bucket]));
    store.del(SAVED_STATE_NAME);
    focusId = null;
    render();
  });
  render();
</script>
</body>
</html>
