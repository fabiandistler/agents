# Basis: prek-eigene builtin-Hooks. Kein Klon, keine Python-venv, offline.
# ACHTUNG: `repo: builtin` ist prek-only. Diese Config laeuft NICHT mehr
# unter dem originalen pre-commit. Sinnvoll vor allem in reinen R-Repos,
# wo sonst nur wegen der Whitespace-Hooks eine Python-Umgebung entsteht.
# Verfuegbare IDs der installierten Version pruefen: prek util list-builtins -v
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
