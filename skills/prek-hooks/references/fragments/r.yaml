
  # R-Formatierung ueber air. Single Binary, braucht weder R noch renv.
  # Formatiert ausschliesslich .R/.r; .qmd und Default-Excludes wie cpp11.R
  # werden seit air 0.9 auch dann uebersprungen, wenn der Hook sie uebergibt.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.11.0
    hooks:
      - id: air-format

  # Schnelles R-Linting ueber jarl im Commit-Pfad. Rust-Binary auf Basis von
  # air, braucht kein R und kein renv. Der Hook ist language: python und
  # installiert jarl einmalig in einen Hook-venv. Prueft auch .Rmd/.qmd.
  # Deckt nur einen Teil der lintr-Regeln ab (keine semantische Analyse,
  # keine Formatierungsregeln, die macht air).
  - repo: https://github.com/etiennebacher/jarl-pre-commit
    rev: 0.6.0
    hooks:
      - id: jarl-check

  # Volles R-Linting ueber lintr, erst beim Push: braucht System-Rscript und
  # stellt eine renv-Umgebung her, der langsame Teil des Setups. Faengt, was
  # jarl (noch) nicht abdeckt. Fuer lintr im Commit-Pfad die Zeile stages
  # entfernen.
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9032
    hooks:
      - id: lintr
        stages: [pre-push]
