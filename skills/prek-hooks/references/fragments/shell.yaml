
  # Shell: Linting und Formatierung.
  # shellcheck laeuft vor shfmt, damit --fix- aehnliche Korrekturen
  # (shellcheck gibt nur Hinweise, formatiert nicht) noch formatiert werden.
  # Flags aus Repo-Konventionen: -S warning wie in .github/workflows/ci.yml,
  # -i 2 -ci wie in poc-spec-loop toolchains.md. shfmt-Default ist [--write],
  # eigenes args muss --write daher erneut mitgeben.
  # shellcheck-py statt koalaman/shellcheck-precommit: kein Docker,
  # laeuft unter prek und pre-commit. scop/shfmt id shfmt: prebuilt Binary,
  # kein Go-/Docker-Bedarf.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-S, warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, '2', '-ci', --write]
