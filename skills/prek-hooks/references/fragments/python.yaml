
  # Python: formatting and linting.
  # ruff-check runs before ruff-format so --fix results still get formatted.
  # Since ruff 0.16, 413 rules (not 59) are default: pin the rule selection
  # in the project ([tool.ruff.lint] extend-select, never select — select
  # replaces the default), otherwise the first run floods the repo.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Typechecker. ty is at 0.0.x — chosen deliberately early (uv-native, fast).
  # Conservative alternative: replace this block with
  #   - repo: https://github.com/pre-commit/mirrors-mypy
  #     hooks: [{ id: mypy }]
  # mypy needs additional_dependencies for project dependencies,
  # ty resolves them via uv from pyproject.toml.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
