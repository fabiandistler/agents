# Generated by setup-hooks.sh on 2026-09-28. Runner: prek.
# Update revs with 'prek update --cooldown-days 7'.
exclude: '(^|/)(fixtures|bad_examples)/'
# Basis: generische Hooks ueber pre-commit/pre-commit-hooks.
# prek erkennt diese Repo-URL und fuehrt seine Rust-Implementierung aus
# (automatic fast path). Config bleibt mit dem originalen pre-commit lauffaehig.
# Preis: prek klont das Repo trotzdem und legt eine Python-venv als Fallback an.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Python: Formatierung und Linting.
  # ruff-check laeuft vor ruff-format, damit --fix-Ergebnisse formatiert werden.
  # Ab ruff 0.16 sind 413 statt 59 Regeln Default: Regelauswahl im Projekt
  # pinnen ([tool.ruff.lint] select), sonst flutet der erste Lauf das Repo.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Typechecker. ty steht bei 0.0.x — bewusst frueh gewaehlt (uv-nativ, schnell).
  # Konservative Alternative: diesen Block ersetzen durch
  #   - repo: https://github.com/pre-commit/mirrors-mypy
  #     hooks: [{ id: mypy }]
  # mypy braucht additional_dependencies fuer Projekt-Abhaengigkeiten,
  # ty loest sie ueber uv aus der pyproject.toml auf.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
        additional_dependencies: ["pyyaml>=6"]
