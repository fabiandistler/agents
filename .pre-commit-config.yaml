# Generated by setup-hooks.sh on 2026-10-04. Runner: prek.
# Update revs with 'prek update --cooldown-days 7'.
exclude: '(^|/)(fixtures|bad_examples)/'
# Basis: generische Hooks ueber pre-commit/pre-commit-hooks.
# prek erkennt diese Repo-URL und fuehrt seine Rust-Implementierung aus
# (automatic fast path). Config bleibt mit dem originalen pre-commit lauffaehig.
# Preis: prek klont das Repo trotzdem und legt eine Python-venv als Fallback an.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Python: formatting and linting.
  # ruff-check runs before ruff-format so --fix results still get formatted.
  # Since ruff 0.16, 413 rules (not 59) are default, so the first run in an
  # existing repo reports many findings. Keep the default (extend-select,
  # never select); clear them with ruff check --fix, then --add-noqa.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Typechecker. ty is at 0.0.x — chosen deliberately early (uv-native, fast).
  # Conservative alternative: replace this block with
  #   - repo: https://github.com/pre-commit/mirrors-mypy
  #     hooks: [{ id: mypy }]
  # mypy needs additional_dependencies for project dependencies,
  # ty resolves them via uv from pyproject.toml.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
        additional_dependencies: ["pyyaml>=6"]

  # Shell: Linting und Formatierung.
  # shellcheck laeuft vor shfmt, damit --fix- aehnliche Korrekturen
  # (shellcheck gibt nur Hinweise, formatiert nicht) noch formatiert werden.
  # Flags aus Repo-Konventionen: -S warning wie in .github/workflows/ci.yml,
  # -i 2 -ci wie in poc-spec-loop toolchains.md. shfmt-Default ist [--write],
  # eigenes args muss --write daher erneut mitgeben.
  # shellcheck-py statt koalaman/shellcheck-precommit: kein Docker,
  # laeuft unter prek und pre-commit. scop/shfmt id shfmt: prebuilt Binary,
  # kein Go-/Docker-Bedarf.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-S, warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, '2', '-ci', --write]
