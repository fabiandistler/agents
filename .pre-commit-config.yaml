# Generated by setup-hooks.sh on 2026-10-13. Runner: prek.
# Update revs with 'prek update --cooldown-days 7'.
exclude: '(^|/)(fixtures|bad_examples)/'
# Base: generic hooks via pre-commit/pre-commit-hooks.
# prek recognizes this repo URL and runs its Rust implementation instead
# (automatic fast path). The config still runs under the original pre-commit.
# Cost: prek clones the repo anyway and creates a Python venv as a fallback.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Python: formatting and linting.
  # ruff-check runs before ruff-format so --fix results still get formatted.
  # Since ruff 0.16, 413 rules (not 59) are default, so the first run in an
  # existing repo reports many findings. Keep the default (extend-select,
  # never select); clear them with ruff check --fix, then --add-noqa.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Typechecker. ty is at 0.0.x — chosen deliberately early (uv-native, fast).
  # Conservative alternative: replace this block with
  #   - repo: https://github.com/pre-commit/mirrors-mypy
  #     hooks: [{ id: mypy }]
  # mypy needs additional_dependencies for project dependencies,
  # ty resolves them via uv from pyproject.toml.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
        additional_dependencies: ["pyyaml>=6"]

  # Shell: linting and formatting.
  # shellcheck runs before shfmt (shellcheck only reports, it does not
  # format). -S warning gates on real problems and skips info/style notes;
  # -i 2 -ci is two-space indent with indented case branches. The shfmt
  # default args are [--write], so custom args must repeat --write.
  # shellcheck-py instead of koalaman/shellcheck-precommit: no Docker, runs
  # under prek and pre-commit. scop/shfmt id shfmt: prebuilt binary, no Go
  # or Docker needed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-S, warning]
        # Vendored upstream skills: re-vendoring overwrites any local fix.
        exclude: ^\.claude/skills/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, '2', '-ci', --write]
        exclude: ^\.claude/skills/

  # Secret scanning, included for every project type: the commit hook is the
  # last point before a secret lands in history. Mirrors the gitleaks job of
  # the CI gate. rev set by `prek update --cooldown-days 7` on 2026-10-12,
  # never hand-pinned. language: golang, so prek fetches a Go toolchain and
  # builds gitleaks on first run.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
