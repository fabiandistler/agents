# factory-pr-review - the reusable PR review pipeline (ADR-0018). A repository
# calls it from its own pr-review.yml; this repository's caller is
# .github/workflows/pr-review.yml.
#
# Three stages: assess (model-free), review (Claude subscription token,
# read-only GitHub token) and publish (write token, no model token). The run
# takes the caller's base-commit workflow on pull_request_target and never
# checks out or executes the pull request head: metadata, diff and base file
# contents arrive through the REST API. Every job holds only the credential its
# stage needs, and publish consumes the earlier stages as artifacts. Publish
# writes on every pull request event; a manual run defaults to a dry run.
#
# A fourth, model-free job, hold, disables the bot's auto-merge on every push
# before the new head is reviewed (GitHub keeps auto-merge on when someone with
# write access pushes), and any auto-merge when do-not-merge is added. A label
# event runs only the hold: it never re-runs the review.
#
# Publish also sets the commit status pr-review/verdict on the reviewed head:
# green for any verdict, so a merge that requires it waits for the review
# without the review becoming a gate. Nothing sets it green ahead of time: a
# new head starts with no status, which a required check reads as waiting.
#
# Scripts: the caller's checkout holds no factory scripts. Every job fetches
# job.workflow_repository at job.workflow_sha, the repository and commit of
# this file, into $RUNNER_TEMP/factory, outside the workspace, without a
# credential, and runs scripts/pr_*.py from there. So the scripts always match
# the pinned workflow file. Only the review job checks out the caller, for
# standards_path and setup_command.
#
# Contexts: `github` and `vars` belong to the caller. vars.PR_AUTO_MERGE is
# the caller repository's variable: only this repository sets it, so other
# callers never plan auto-merge (ADR-0011, ADR-0018).
name: factory-pr-review

on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number of a manual run; empty on a pull request event
        required: false
        type: string
        default: ""
      dry_run:
        # Read only on a manual run: a pull request event always writes.
        description: On a manual run, print the planned actions instead of applying them
        required: false
        type: boolean
        default: true
      skip_head_prefixes:
        # Pull requests another process reviews, e.g. `maintenance/` in
        # repo-maintenance. Checked from the fetched context, so a manual run
        # honours it too (scripts/pr_skip.py).
        description: Comma-separated head-branch prefixes whose pull requests get no review, publish or hold
        required: false
        type: string
        default: ""
      standards_path:
        description: Standards file for pr_review.py --standards, relative to the caller's base checkout or absolute
        required: false
        type: string
        default: ""
      fail_on_unavailable:
        description: Fail the run after publishing when the review is unavailable
        required: false
        type: boolean
        default: false
      quiet_logs:
        description: Keep the plan JSON, which holds the model's text, out of the log and the step summary
        required: false
        type: boolean
        default: false
      setup_command:
        # Runs in the review job only, before Claude Code is installed and
        # without the model token. It comes from the caller's workflow file,
        # never from event data.
        description: Shell command run in the caller's base checkout before the review
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# No scope by default; each job below opts in to exactly what it needs, capped
# by the calling job's permissions.
permissions: {}

# The only concurrency group of the PR review: callers define none, so the
# group never cancels its own caller. A new push supersedes the run still
# reviewing the previous head. A label event gets a group per label, so it
# never cancels a review run and a later label never cancels a do-not-merge
# hold. `github` is the caller's context, `inputs.pr` the caller's dispatch input.
concurrency:
  group: >-
    pr-review-${{ github.event.pull_request.number || inputs.pr }}${{
    github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true

jobs:
  hold:
    # Model-free and review-free: runs at once on a push, in parallel with the
    # assessment, and on do-not-merge. Never on a manual run, so its write needs
    # no dry-run guard. It only disables; publish alone may enable.
    if: >-
      github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && github.event.label.name == 'do-not-merge')
    runs-on: ubuntu-latest
    # Disabling auto-merge needs contents and pull-requests write; removing the
    # auto-merge:bot label goes through the issues API.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Fetch the factory scripts
        env:
          SERVER_URL: ${{ github.server_url }}
          FACTORY_REPOSITORY: ${{ job.workflow_repository }}
          FACTORY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/factory"
          git -C "$RUNNER_TEMP/factory" fetch --quiet --depth 1 --no-tags \
            "$SERVER_URL/$FACTORY_REPOSITORY" "$FACTORY_SHA"
          git -C "$RUNNER_TEMP/factory" checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Hold the auto-merge until the new head is reviewed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_SKIP_HEAD_PREFIXES: ${{ inputs.skip_head_prefixes }}
        run: |
          python3 "$RUNNER_TEMP/factory/scripts/pr_publish.py" --hold --live \
            --repo "${{ github.repository }}" --pr "$PR" --write

  assess:
    # A label event only needs the hold; skipping the assessment also skips the
    # review and publish, so it never calls the model.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    # Read-only: the policy needs the pull request, its comments and the base
    # file contents. Check results are no gate (the ruleset waits for them), so
    # there is no checks scope. Nothing here may write.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      same_repo: ${{ steps.origin.outputs.same_repo }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Fetch the factory scripts
        env:
          SERVER_URL: ${{ github.server_url }}
          FACTORY_REPOSITORY: ${{ job.workflow_repository }}
          FACTORY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/factory"
          git -C "$RUNNER_TEMP/factory" fetch --quiet --depth 1 --no-tags \
            "$SERVER_URL/$FACTORY_REPOSITORY" "$FACTORY_SHA"
          git -C "$RUNNER_TEMP/factory" checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch the pull request context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Event and dispatch values reach the script through env, never as
          # shell source.
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          python3 "$RUNNER_TEMP/factory/scripts/pr_github.py" \
            --pr "$PR" \
            --repo "${{ github.repository }}" \
            --output context.json

      - name: Check whether the head lives in this repository
        id: origin
        # A manual run has no pull request event to read the head repository
        # from, so the review guard takes it from the fetched context. Only an
        # explicit `fork: false` counts as same-repository.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json

          with open("context.json", encoding="utf-8") as handle:
              context = json.load(handle)
          print("same_repo=" + ("true" if context.get("fork") is False else "false"))
          PY

      - name: Check whether another process reviews this head branch
        id: skip
        env:
          PR_SKIP_HEAD_PREFIXES: ${{ inputs.skip_head_prefixes }}
        run: python3 "$RUNNER_TEMP/factory/scripts/pr_skip.py" --context context.json >> "$GITHUB_OUTPUT"

      - name: Upload the context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-context
          path: context.json
          if-no-files-found: error

      - name: Classify the risk
        run: python3 "$RUNNER_TEMP/factory/scripts/pr_risk.py" --context context.json --output assessment.json

      - name: Upload the assessment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-assessment
          path: assessment.json
          if-no-files-found: error

  review:
    needs: assess
    # Drafts are assessed but not reviewed until they are marked ready. A fork
    # pull request is assessed too, but its diff never reaches the model: the
    # job holds a secret and the diff is untrusted input. A manual run carries
    # no pull request event, so the same-repository guard reads the assess
    # output for both triggers. A skipped head branch gets no model call.
    if: >-
      needs.assess.outputs.same_repo == 'true' &&
      needs.assess.outputs.skip != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    # The caller's base checkout is for standards_path and setup_command; the
    # model response leaves the job as an artifact, never as a GitHub write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the factory scripts
        env:
          SERVER_URL: ${{ github.server_url }}
          FACTORY_REPOSITORY: ${{ job.workflow_repository }}
          FACTORY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/factory"
          git -C "$RUNNER_TEMP/factory" fetch --quiet --depth 1 --no-tags \
            "$SERVER_URL/$FACTORY_REPOSITORY" "$FACTORY_SHA"
          git -C "$RUNNER_TEMP/factory" checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-context

      - name: Run the caller's setup command
        if: inputs.setup_command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Install Claude Code
        # The subscription token works only inside Anthropic's own CLI. The
        # version is pinned because the next step hands this binary the token;
        # bump it on purpose (runbook: CLI update), Dependabot does not see it.
        run: npm install --global @anthropic-ai/claude-code@2.1.321

      - name: Review the diff
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          STANDARDS_PATH: ${{ inputs.standards_path }}
        run: |
          set -euo pipefail
          standards=()
          if [ -n "$STANDARDS_PATH" ]; then
            standards=(--standards "$STANDARDS_PATH")
          fi
          python3 "$RUNNER_TEMP/factory/scripts/pr_review.py" --context context.json \
            "${standards[@]}" > review.json

      - name: Upload the review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review
          path: review.json
          if-no-files-found: error

  publish:
    # After the hold, so the auto-merge decision for the reviewed head is the
    # last write. A failed or skipped hold does not stop it: publish decides
    # from a fresh fetch.
    needs: [assess, review, hold]
    # A skipped review (draft, fork) still publishes the assessment, and a
    # failed review still publishes `review:unavailable`. A failed assessment
    # leaves nothing to publish, and a skipped head branch gets nothing.
    if: >-
      always() && needs.assess.result == 'success' &&
      needs.assess.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # contents: write is for enabling auto-merge. statuses: write is for
    # pr-review/verdict, the one context the writer sets.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Fetch the factory scripts
        env:
          SERVER_URL: ${{ github.server_url }}
          FACTORY_REPOSITORY: ${{ job.workflow_repository }}
          FACTORY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/factory"
          git -C "$RUNNER_TEMP/factory" fetch --quiet --depth 1 --no-tags \
            "$SERVER_URL/$FACTORY_REPOSITORY" "$FACTORY_SHA"
          git -C "$RUNNER_TEMP/factory" checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-context

      - name: Download the assessment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-assessment

      - name: Download the review
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review
        # The review job is skipped for drafts and forks, so its artifact is
        # legitimately absent.
        continue-on-error: true

      - name: Reconstruct the review when the review job was skipped
        # Without the model token this yields `skipped` for a draft or fork and
        # `unavailable` otherwise, so a missing review can never look like a pass.
        run: |
          if [ -s review.json ]; then
            exit 0
          fi
          python3 "$RUNNER_TEMP/factory/scripts/pr_review.py" --context context.json > review.json

      - name: Publish the assessment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          WRITE: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
          # Auto-merge is planned only when the caller's repository variable is
          # exactly `true`; only this repository sets it.
          PR_AUTO_MERGE: ${{ vars.PR_AUTO_MERGE }}
          PR_SKIP_HEAD_PREFIXES: ${{ inputs.skip_head_prefixes }}
          QUIET_LOGS: ${{ inputs.quiet_logs }}
          FAIL_ON_UNAVAILABLE: ${{ inputs.fail_on_unavailable }}
          # The run page the verdict status links to.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The publisher appends the decision, the confidence and the labels it
          # applied to the run summary itself, also when an action failed. A
          # failed action still prints the results JSON, so the exit status is
          # captured and reported after the JSON has been printed. With
          # quiet_logs the summary and the log carry no plan JSON, which holds
          # the model's text. fail_on_unavailable fails the run (exit 8) only
          # after the unavailable review has been published.
          options=()
          if [ "$QUIET_LOGS" = "true" ]; then
            options+=(--quiet)
          fi
          if [ "$FAIL_ON_UNAVAILABLE" = "true" ]; then
            options+=(--fail-on-unavailable)
          fi
          set +e
          if [ "$WRITE" = "true" ]; then
            python3 "$RUNNER_TEMP/factory/scripts/pr_publish.py" \
              --live \
              --repo "${{ github.repository }}" \
              --pr "$PR" \
              --assessment assessment.json \
              --review review.json \
              --summary "$GITHUB_STEP_SUMMARY" \
              --status-url "$RUN_URL" \
              "${options[@]}" \
              --write > plan.json
          else
            # The dry run plans from a fresh fetch too, so it re-checks the head
            # SHA and runs the current policy exactly as the write path does.
            python3 "$RUNNER_TEMP/factory/scripts/pr_publish.py" \
              --live \
              --repo "${{ github.repository }}" \
              --pr "$PR" \
              --assessment assessment.json \
              --review review.json \
              --summary "$GITHUB_STEP_SUMMARY" \
              --status-url "$RUN_URL" \
              "${options[@]}" > plan.json
          fi
          status=$?
          set -e
          if [ "$QUIET_LOGS" != "true" ]; then
            cat plan.json
          fi
          exit "$status"
