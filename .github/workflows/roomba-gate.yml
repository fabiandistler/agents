# roomba-gate - blockt, was ein Werkzeug abschliessend entscheiden kann.
# Diese Checks ersetzen die frueheren Katalog-Jobs `security-footguns` und
# `dead-code` (lokale Variablen/Imports). Was hier gruen ist, braucht keinen Agentenlauf.
#
# Ablage: .github/workflows/roomba-gate.yml
name: roomba-gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff (ungenutzte Imports/Variablen, unsichere Muster)
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: uvx ruff check --select E,F,B,S .
      - name: bandit
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: uvx bandit -r . -q

  r-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R vorhanden?
        id: probe
        run: echo "is_pkg=${{ hashFiles('DESCRIPTION') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        if: steps.probe.outputs.is_pkg == 'true'
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.probe.outputs.is_pkg == 'true'
        with:
          extra-packages: any::lintr
      - name: lintr (object_usage, unused_import)
        if: steps.probe.outputs.is_pkg == 'true'
        run: |
          Rscript -e 'lintr::lint_package(linters = list(
            lintr::object_usage_linter(),
            lintr::unused_import_linter()
          )) |> print()'
          Rscript -e 'if (length(lintr::lint_package())) quit(status = 1)'
