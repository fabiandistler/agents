# fix-task - this repository's caller of the factory's Fix task,
# .github/workflows/factory-fix-task.yml (ADR-0016, ADR-0018): files each
# failed factory run as one deduplicated issue.
#
# A local `./` call runs the called workflow from the same commit as this file.
# The called job holds the trigger filter, the concurrency, the timeout and the
# script call; this file sets only the watch list and the manual inputs.
#
# Watch list: the caller workflows of this repository, never this file and
# never a called factory-*.yml file, whose failure is its caller's failed run.
# It equals scripts/factory_failure_policy.py's WATCHED_WORKFLOWS.
name: fix-task

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] model-free, GITHUB_TOKEN only; it reads the run by id and writes issues
    workflows: [implementer, skill-audit, issue-triage, pr-review, rework, retro]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id
        required: true
        type: string
      dry_run:
        # A manual run plans only unless this is set to false.
        description: Print the plan instead of applying it
        required: false
        type: boolean
        default: true

# No scope by default; the job below opts in to exactly what it needs.
permissions: {}

jobs:
  file:
    # These cap the called job's permissions, which asks for exactly these.
    permissions:
      issues: write
      actions: read
      checks: read
    uses: ./.github/workflows/factory-fix-task.yml
    with:
      run_id: ${{ inputs.run_id }}
      dry_run: ${{ inputs.dry_run != false }}
