# implementer - this repository's caller of the factory's implementer task,
# .github/workflows/factory-implementer.yml (ADR-0014, ADR-0018): one issue
# labelled `ready-for-agent` becomes one pull request.
#
# A local `./` call runs the called workflow from the same commit as this file.
# The called job holds the trigger filter, the per-issue concurrency, the
# timeout, the prompt and the report; this file sets only this repository's
# inputs. The Actions jobs API lists the job as `implement / implement`, which
# scripts/implementer_claim.py's `--job-name implement` matches.
#
# Triggers: a person adds `ready-for-agent` to an open issue; a manual run for
# one issue.
name: implementer
# scripts/factory_failure_policy.py reads the issue number from this run-name
# (ADR-0016); a called workflow cannot set it, so it stays in the caller.
run-name: "implementer: issue #${{ github.event.issue.number || inputs.issue }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string

# No scope by default; the job below opts in to exactly what it needs.
permissions: {}

jobs:
  implement:
    # These cap the called job's permissions, which asks for exactly these.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/factory-implementer.yml
    with:
      issue: ${{ inputs.issue }}
      check_command: scripts/check_all.sh
      # The same pins as ci.yml, so scripts/check_all.sh gives CI's answer.
      setup_command: pip install -r scripts/check_all.requirements.txt && prek install
      # The bats check needs the pinned submodules under test/bats/.
      submodules: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
