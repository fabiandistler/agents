# pr-review - this repository's caller of the reusable PR review pipeline,
# .github/workflows/factory-pr-review.yml (ADR-0018). The jobs, their
# credentials and the security model live there; this file keeps the triggers,
# the file name and the permission cap.
#
# The file name and its pull_request_target trigger are what the Actions event
# policy targets (docs/agents/pr-review-event-policy.md) and what the rework
# task watches (scripts/rework_policy.py): keep both. Every repository-specific
# input stays at its default here, so the review behaves as before the
# extraction; other repositories call the same file at a pinned commit SHA.
name: pr-review

on:
  # Deliberate: the run takes the base commit's workflow and never checks out
  # or executes the head (docs/agents/pr-review-runbook.md, "Jobs and security
  # model"; the header of factory-pr-review.yml).
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      dry_run:
        # A manual run plans only unless this is set to false; then it writes
        # exactly what a pull request event would.
        description: Print the planned actions instead of applying them
        required: false
        type: boolean
        default: true

# No scope by default; the calling job opts in to the cap below.
permissions: {}

# No concurrency group here: the called workflow defines the only one, and a
# group shared by caller and called workflow would cancel the caller.

jobs:
  pr-review:
    # The Actions jobs API lists the called jobs as `pr-review / <job>`.
    # The union of the called jobs' scopes; each called job asks for less.
    # statuses: write is for pr-review/verdict, which only publish sets.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    uses: ./.github/workflows/factory-pr-review.yml
    with:
      # Empty on a pull request event, where the called workflow reads the
      # number from the event.
      pr: ${{ inputs.pr || '' }}
      # Read only on a manual run. Anything but an explicit false plans only.
      dry_run: ${{ inputs.dry_run != false }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
