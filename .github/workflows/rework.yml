# rework - this repository's caller of the factory's Rework task,
# .github/workflows/factory-rework.yml (ADR-0015, ADR-0018): when the automated
# review of an implementer pull request (`agent/issue-<n>`) ends with `concerns`
# or `block`, one model run fixes only the findings it was handed and pushes.
#
# A local `./` call runs the called workflow from the same commit as this file.
# The called jobs hold the trigger filter, the concurrency, the timeouts, the
# gate, the prompt and the report; this file sets only this repository's
# inputs. The Actions jobs API lists the jobs as `rework / gate` and
# `rework / rework`, which the capacity check in scripts/rework_gate.py
# matches.
#
# Trigger: the completion of a pr-review run, or a manual run for one pull
# request. Not a label: pr-review's publish job labels with GITHUB_TOKEN, and
# GITHUB_TOKEN events start no runs. workflow_run fires only from this file on
# the default branch.
name: rework

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the model-free gate re-checks the run and the pull request from the API
    workflows: [pr-review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

# No scope by default; the job below opts in to exactly what it needs.
permissions: {}

jobs:
  rework:
    # These cap the called jobs' permissions: the gate asks for contents,
    # actions, pull-requests and issues, the model job for contents and
    # id-token.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/factory-rework.yml
    with:
      pr: ${{ inputs.pr }}
      check_command: scripts/check_all.sh
      # The same pins as ci.yml, so scripts/check_all.sh gives CI's answer.
      setup_command: pip install -r scripts/check_all.requirements.txt && prek install
      # The bats check needs the pinned submodules under test/bats/.
      submodules: true
      model: ${{ vars.REWORK_MODEL || 'sonnet' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
