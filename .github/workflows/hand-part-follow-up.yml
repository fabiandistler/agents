# hand-part-follow-up - this repository's caller of the factory's follow-up
# task, .github/workflows/factory-hand-part-follow-up.yml (ADR-0018). A local
# `./` call runs the called workflow from the same commit as this file; the
# called job holds the filter on the merged pull request.
name: Hand-applied follow-up

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  file-follow-up:
    # These cap the called job's permissions, which asks for exactly these.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/factory-hand-part-follow-up.yml
