name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned check tools
        run: pip install -r scripts/check_all.requirements.txt

      - name: All checks
        # The check list lives once, in scripts/check_all.sh. Mermaid runs in
        # its own job below because it needs Node.
        run: scripts/check_all.sh --skip mermaid --tail 0

  mermaid:
    # Browserless syntax check over every tracked Markdown file with
    # Mermaid's own parser (jsdom, no browser download); the pinned command
    # and the broken-fixture guard live in scripts/check_all.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Mermaid diagrams (browserless)
        run: scripts/check_all.sh --only mermaid --tail 0
