name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Manifest in sync
        run: python scripts/build_manifest.py --check

      - name: Catalogue tables in sync
        run: python scripts/check_docs.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Python compiles
        run: python -m compileall -q scripts skills mcp-wiki-server

      - name: Shell lint (shellcheck)
        # -S warning: gate on real problems; skip advisory info/style notes
        # (eval-suite/run.sh intentionally word-splits flag lists and passes
        # single-quoted R code, both of which are info-level).
        run: shellcheck -S warning install.sh scripts/test_install.sh eval-suite/run.sh

      - name: install.sh smoke test
        run: bash scripts/test_install.sh
