name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned check tools
        run: pip install -r scripts/check_all.requirements.txt

      - name: All checks
        # The check list lives once, in scripts/check_all.sh. Mermaid and Bats
        # run in their own jobs below: Mermaid needs Node, Bats the submodules.
        run: scripts/check_all.sh --skip mermaid,bats --tail 0

  bats:
    # `bats test/` with the pinned bats-core, bats-support and bats-assert
    # submodules; the command lives in scripts/check_all.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned check tools
        run: pip install -r scripts/check_all.requirements.txt

      - name: Bats suites
        run: scripts/check_all.sh --only bats --tail 0

  mermaid:
    # Browserless syntax check over every tracked Markdown file with
    # Mermaid's own parser (jsdom, no browser download); the pinned command
    # and the broken-fixture guard live in scripts/check_all.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate Mermaid diagrams (browserless)
        run: scripts/check_all.sh --only mermaid --tail 0
