name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: ruff 0.16.0 shipped stricter defaults (EXE001, FURB167, I001,
        # …) that flag pre-existing first-party files unrelated to any given PR.
        # Bump deliberately alongside a lint-cleanup pass, not implicitly per run.
        run: pip install ruff==0.15.8

      - name: Manifest in sync
        run: python scripts/build_manifest.py --check

      - name: Router bodies in sync
        run: python scripts/build_routers.py --check

      - name: Description budget
        run: python scripts/check_descriptions.py

      - name: Catalogue tables in sync
        run: python scripts/check_docs.py

      - name: Plugin marketplace in sync
        run: python scripts/check_plugins.py

      - name: Skill frontmatter valid
        # compileall proves the validator parses; only running it proves its
        # allowlist still matches the frontmatter this repo actually ships.
        run: |
          pip install "pyyaml>=6"
          fail=0
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] || continue
            python3 scripts/quick_validate.py "$d" >/dev/null || {
              echo "::error file=${d}SKILL.md::$(python3 scripts/quick_validate.py "$d" 2>&1)"
              fail=1
            }
          done
          exit $fail

      - name: Lint (ruff)
        run: ruff check .

      - name: Python compiles
        run: python -m compileall -q scripts skills mcp-wiki-server

      - name: Shell lint (shellcheck)
        # -S warning: gate on real problems; skip advisory info/style notes
        # (eval-suite/run.sh intentionally word-splits flag lists and passes
        # single-quoted R code, both of which are info-level).
        run: shellcheck -S warning install.sh scripts/test_install.sh scripts/roomba-scan.sh eval-suite/run.sh

      - name: install.sh smoke test
        run: bash scripts/test_install.sh
