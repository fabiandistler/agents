name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned check tools
        run: pip install -r scripts/check_all.requirements.txt

      - name: All checks
        # The check list lives once, in scripts/check_all.sh. Mermaid and Bats
        # run in their own jobs below: Mermaid needs Node, Bats the submodules.
        run: scripts/check_all.sh --skip mermaid,bats --tail 0

  bats:
    # `bats test/` with the pinned bats-core, bats-support and bats-assert
    # submodules; the command lives in scripts/check_all.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned check tools
        run: pip install -r scripts/check_all.requirements.txt

      - name: Bats suites
        run: scripts/check_all.sh --only bats --tail 0

  skill-scripts-py39:
    # Skill scripts run on user machines with the system python3, which is
    # 3.9 on RHEL 9 and Posit Workbench. ruff.toml's per-file-target-version
    # catches 3.10+ syntax; this job catches the runtime rest, such as
    # zip(strict=True). The tests need pytest only, and pytest 9 dropped 3.9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python has no 3.9 build for the current Ubuntu image; uv brings
      # its own 3.9 (python-build-standalone), so uv runs on 3.12 here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.13.10

      - name: Skill-script tests on Python 3.9
        run: uv run --python 3.9 --no-project --with pytest==8.4.2 python -m pytest -q skills/*/scripts

  mermaid:
    # Browserless syntax check over every tracked Markdown file with
    # Mermaid's own parser (jsdom, no browser download); the pinned command
    # and the broken-fixture guard live in scripts/check_all.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate Mermaid diagrams (browserless)
        run: scripts/check_all.sh --only mermaid --tail 0
