# retro - this repository's caller of the factory's Retro task,
# .github/workflows/factory-retro.yml (ADR-0017, ADR-0018): about one merged
# agent pull request in ten becomes one proposed change to the factory's own
# instruction texts.
#
# A local `./` call runs the called workflow from the same commit as this file.
# The called jobs hold the gate, the model step, the concurrency and the
# timeouts; this file sets the schedule, the check and the editable paths.
#
# The commit that added this file is the gate's eligibility floor: pull
# requests merged before it are never counted or selected. A later edit of the
# file moves nothing.
name: retro

on:
  schedule:
    # Daily, off the hour. Scheduled runs start on the default branch only.
    - cron: "23 6 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

# No scope by default; the calling job opts in to the cap below.
permissions: {}

jobs:
  retro:
    # The union of the called jobs' scopes: the gate labels (pull-requests,
    # issues), reads the implementer's artifact (actions) and the floor commit
    # (contents); the model job exchanges the App token (id-token: write).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: ./.github/workflows/factory-retro.yml
    with:
      # The bats check needs the pinned submodules under test/bats/.
      submodules: true
      # The same pins as ci.yml, so scripts/check_all.sh gives CI's answer.
      setup_command: |
        pip install -r scripts/check_all.requirements.txt
        prek install
      check_command: scripts/check_all.sh
      editable_paths: |
        scripts/pr_review_prompt.md
        scripts/issue_triage_prompt.md
        docs/agents/
        AGENTS.md
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
