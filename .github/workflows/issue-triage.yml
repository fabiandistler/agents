# issue-triage - calls the reusable issue triage (factory-issue-triage.yml,
# ADR-0018) for this repository. The jobs, their filter, the per-issue
# concurrency and the per-job permissions live there; this file holds only the
# triggers and the scope cap. See ADR-0013.
#
# A local `./` call runs the called workflow from the same commit as this
# file, so it needs no SHA pin; a caller in another repository pins one.
name: issue-triage

on:
  issues:
    types: [opened, labeled]
  # Deliberate (ADR-0013): the reporter answering a needs-info issue. Only
  # issues by authors with write access reach the model
  # (scripts/issue_triage_policy.py).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      dry_run:
        # A manual run plans only unless this is set to false.
        description: Print the planned actions instead of applying them
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  triage:
    uses: ./.github/workflows/factory-issue-triage.yml
    # The union of the called jobs' scopes; the called workflow narrows each
    # job to its own.
    permissions:
      contents: read
      issues: write
    with:
      issue: ${{ inputs.issue }}
      # On issue events the called workflow writes whatever dry_run says, so
      # only a manual run's choice matters.
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
