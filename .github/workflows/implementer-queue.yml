# implementer-queue - this repository's caller of the factory's implementer
# queue, .github/workflows/factory-implementer-queue.yml (#801): when capacity
# may have freed up, dispatch implementer.yml for the next issue that waits
# with `ready-for-agent`.
#
# Triggers: an implementer run completed (its job not skipped); an issue
# closed, which may be a blocker; a schedule, a slow fallback in case a
# `workflow_run` chain stops or a closing starts no run (an issue a
# GITHUB_TOKEN merge closes may not): GitHub starts it late or skips slots
# (observed 2026-11-15: 2 runs in about 12 slots, each 30 min or more late,
# #864); a push to main that changes this file, so the caller's own merge or a
# pin bump starts the queue once, not dry (#961); a manual run, dry by
# default. A run this queue dispatched starts no workflow_run, so the
# implementer's follow-up job dispatches this workflow with dry_run false after
# it (#863). Such a queue run starts none either, so
# the called workflow's report-failure job dispatches fix-task.yml with its run
# id when its starter fails (#909); fix-task.yml watches every other run.
name: implementer-queue

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] model-free; it reads no payload of the run, only the API, and checks out no code of it
    workflows: [implementer]
    types: [completed]
  issues:
    types: [closed]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: [.github/workflows/implementer-queue.yml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the pick and dispatch nothing
        type: boolean
        default: true

# No scope by default; the job below opts in to exactly what it needs.
permissions: {}

jobs:
  start-next:
    # A run whose implement job was skipped (any other label) frees nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'skipped'
    # These cap the called job's permissions, which asks for exactly these.
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/factory-implementer-queue.yml
    with:
      workflow_file: implementer.yml
      fix_task_workflow: fix-task.yml
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
