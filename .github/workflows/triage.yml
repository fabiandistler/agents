name: Issue triage

# The discover/classify/apply split is the safety boundary. Only the apply job
# has `issues: write`; only the classify job may run a model. See
# docs/agents/triage-runbook.md before changing the split.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage
        required: true
        type: string
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-triage-${{ github.event.inputs.issue || github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.discover.outputs.issues }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute issue numbers
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issues" ]; then
            if [ "$AUTHOR_TYPE" = "Bot" ]; then
              echo "issues=[]" >> "$GITHUB_OUTPUT"
            else
              printf 'issues=[%s]\n' "$EVENT_ISSUE" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          case "$DISPATCH_ISSUE" in
            '' | *[!0-9]*)
              echo "workflow_dispatch needs a numeric issue input" >&2
              exit 1
              ;;
          esac
          printf 'issues=[%s]\n' "$DISPATCH_ISSUE" >> "$GITHUB_OUTPUT"

  classify:
    name: Classify issue ${{ matrix.issue }}
    needs: discover
    if: needs.discover.outputs.issues != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    strategy:
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.issues) }}
      max-parallel: 2
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and sanitize issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/triage.py fetch \
            --issue "${{ matrix.issue }}" \
            --output ".triage/${{ matrix.issue }}/issue.json"
      - name: Write fixed decision
        run: |
          mkdir -p ".triage/${{ matrix.issue }}"
          cat > ".triage/${{ matrix.issue }}/decision.json" <<'JSON'
          {"category":"unclear","state":"needs-triage","confidence":0.0,"reason":"Manual triage path: fixed needs-triage decision."}
          JSON
      - name: Upload decision
        uses: actions/upload-artifact@v4
        with:
          name: triage-decision-${{ matrix.issue }}
          path: .triage/${{ matrix.issue }}/
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Apply labels to issue ${{ matrix.issue }}
    needs: [discover, classify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.issues) }}
      max-parallel: 2
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Download decision
        uses: actions/download-artifact@v4
        with:
          name: triage-decision-${{ matrix.issue }}
          path: .triage/${{ matrix.issue }}
      - name: Validate and apply decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/triage.py apply \
            --issue "${{ matrix.issue }}" \
            --decision ".triage/${{ matrix.issue }}/decision.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"
