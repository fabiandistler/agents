# maintenance-gate - blocks what a tool can decide conclusively, so no agent run
# spends a rotation slot on it. Paired with MAINTENANCE.md, which lists under
# "What does NOT belong in this catalog" the jobs these checks replace.
#
# Only the secrets job is here. Omitted deliberately:
#   - python-lint and r-lint (the plugin's template): ci.yml already runs ruff
#     (prek hook, via scripts/check_all.sh) over this repo's first-party Python,
#     and both template jobs are gated on hashFiles('pyproject.toml',
#     'requirements.txt') or 'DESCRIPTION', which this repo lacks, so they
#     would never run.
#   - workflow security: ci.yml runs zizmor as the `zizmor` check of
#     scripts/check_all.sh, and scripts/test_workflow_action_pins.py requires
#     every action to be pinned to a commit SHA.
name: maintenance-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
