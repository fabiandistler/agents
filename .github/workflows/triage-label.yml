name: Triage label

# Calls the reusable triage label (factory-triage-label.yml, ADR-0018): every
# new issue without a state label gets `needs-triage`. The state-label guard
# lives there. A local `./` call runs the called workflow from the same commit
# as this file, so it needs no SHA pin; a caller in another repository pins one.

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    uses: ./.github/workflows/factory-triage-label.yml
    permissions:
      issues: write
