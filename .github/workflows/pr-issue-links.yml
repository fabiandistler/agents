# pr-issue-links - this repository's caller of the factory's PR issue-link
# check, .github/workflows/factory-pr-issue-links.yml (ADR-0018). A local `./`
# call runs the called workflow from the same commit as this file.
name: PR issue links

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  issue-links:
    # These cap the called job's permissions, which asks for exactly these.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/factory-pr-issue-links.yml
