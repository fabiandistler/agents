# Ruff configuration for first-party Python in this repo
# (repo tooling). Intentionally-varied
# eval/fixture sample files are excluded so they are never reformatted or linted.

target-version = "py310"
line-length = 100

extend-exclude = [
    "**/evals/**",
    "**/fixtures/**",
    "**/bad_examples/**",
]

[lint]
# request-without-timeout: flags module-level `requests.*` calls without
# `timeout`, and `requests`/`httpx` calls with `timeout=None`. Does not see
# calls on Session/Client instances, and ignores aiohttp.
# Source: Albada, Building Applications with AI Agents, ch. 4.
extend-select = ["S113"]
