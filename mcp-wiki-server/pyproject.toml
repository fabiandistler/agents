[project]
name = "mcp-wiki-server"
version = "0.1.0"
description = "MCP server exposing a wiki/knowledge base, one tool per topic folder."
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2"]

[project.scripts]
mcp-wiki-server = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
