# scanner helpers vendored by scripts/vendor_repo_maintenance.py (fixes go
# upstream to fabiandistler/repo-maintenance).
exclude = [
    "test/bats/",
    "scripts/maintenance-new-deps.py",
    "scripts/maintenance-r-advisories.py",
]
