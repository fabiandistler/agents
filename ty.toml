# ty configuration, read by the ty hook in .pre-commit-config.yaml.

[src]
# Pinned third-party Bats checkouts (git submodules), not our Python, and the
# scanner helpers and the instruction-unicode check vendored by
# scripts/vendor_repo_maintenance.py (fixes go upstream to
# fabiandistler/repo-maintenance).
exclude = [
    "test/bats/",
    "scripts/maintenance-new-deps.py",
    "scripts/maintenance-r-advisories.py",
    "scripts/maintenance-instruction-unicode.py",
]
